name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nyx_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reject Heroku deployment credentials in GitHub Actions
        run: node scripts/guard-no-heroku-actions.mjs
      - name: Install dependencies
        run: npm ci
      - name: Security check
        run: npm run security:check
      - name: Build NestJS
        run: npm run build
      - name: Run tests
        env:
          NYX_TEST_PG_URL: postgresql://postgres@127.0.0.1:5432/nyx_ci
        run: npm test
